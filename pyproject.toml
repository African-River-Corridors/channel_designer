[project]
name = "open-waterway-designer"
version = "0.3.1"
description = "Navigation channel design for inland waterways: width, bend and depth rules (PIANC, Chinese GB 50139), alignment, and cut and dredge volumes."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "African River Corridors Limited" }]
readme = "README.md"
keywords = ["inland-waterways", "navigation-channel", "pianc", "dredging", "earthworks", "river-engineering"]
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    # Pinned to a release tag, not @main (issue #11). The repository was renamed from vessel_designer.
    "vessel_designer @ git+https://github.com/African-River-Corridors/open-vessel-concept-drawings@v0.2.2",
]

[project.optional-dependencies]
# Raster DEM I/O for the volume integrator and DEM-backed terrain samplers.
dem = ["rasterio>=1.3", "scipy>=1.11", "affine>=2.4"]
dev = ["pytest>=8", "pyyaml>=6"]

[project.urls]
Repository = "https://github.com/African-River-Corridors/open-waterway-designer"
Issues = "https://github.com/African-River-Corridors/open-waterway-designer/issues"

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# The package is the pure-Python layer in src/owd plus the Rust extension
# owd._core (crates/owd-py), built as one abi3 wheel per platform: a user's `pip install`
# needs no compiler (#11).
[tool.maturin]
python-source = "src"
module-name = "owd._core"
manifest-path = "crates/owd-py/Cargo.toml"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
