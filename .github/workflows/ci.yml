name: CI

on:
  # Pushes to main only: a ticket branch is tested once, by its pull request, not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a break in an upstream git dependency shows up without a push here.
  schedule:
    - cron: "17 6 * * 1"

# A new push to a pull request cancels its older, now-stale run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh. Target under 5 minutes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The gate runs the Rust tests with cargo-nextest (pinned). The slowest tests run in
      # nightly.yml instead; see docs/agents/slow-tests.md.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.100
      # vessel_designer and technical_drawings_for_agents install from git. While those
      # repositories are private this step needs read access to them; after release it does not.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,dem,drawings]'
      - name: Fast gate
        run: bash tools/gates.sh

  # The test job uses the pinned git refs in pyproject.toml. This job tries both git
  # dependencies at @main instead, so an upstream change that will break the next pin bump
  # shows up here first. Weekly and on demand only; it never gates a pull request.
  upstream-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (git dependencies at @main)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,dem,drawings]'
          python -m pip install --force-reinstall \
            'vessel_designer @ git+https://github.com/African-River-Corridors/open-vessel-concept-drawings@main' \
            'technical_drawings_for_agents @ git+https://github.com/African-River-Corridors/technical_drawings_for_agents@main'
      - name: Test
        run: python -m pytest -q

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # The desktop app (spec 0003). Kept out of the fast gate: it needs Node and the Tauri system
  # libraries, and the workspace's default members must build without them.
  app-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App crate (clippy, tests)
        run: |
          cargo clippy -p owd-app --all-targets -- -D warnings
          cargo test -p owd-app

  # End-to-end smoke test (spec 0003): the built debug app, driven by Tauri's WebDriver on Linux.
  # Its own job, so the fast gate keeps its time budget.
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries, WebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: tauri-driver (cached)
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build the debug app
        working-directory: app
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Smoke test
        working-directory: app
        run: xvfb-run -a bash e2e/run.sh

  # Web parity (spec 0011): every web fixture gives the same document from the wasm design session as from
  # native `owd run`, by the ADR 0005 tolerance. Not a required check, and apart from `test` so the fast
  # gate keeps its time budget. The wasm-bindgen CLI is the version the owd-web crate pins, and is cached.
  web-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/owd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked
      - name: Lint the web session for wasm
        run: cargo clippy --target wasm32-unknown-unknown -p owd-web -- -D warnings
      - name: Build and lint owd-reach for wasm (spec 0012)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p owd-reach -- -D warnings
          cargo build --target wasm32-unknown-unknown -p owd-reach
      - name: Build the web package
        run: bash tools/build_web.sh
      # Release: the pool search is far too slow in a debug build.
      - name: Build owd
        run: cargo build --release -p owd-cli
      - name: The comparison fails on a doctored value
        run: node --test tools/web_parity_compare.test.mjs
      - name: Parity, wasm against native
        run: node tools/web_parity.mjs

  # The web app (spec 0011): the web build of the front end over the wasm design session, in headless
  # Chrome. Not a required check, and apart from `test`.
  web-app:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/owd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked
      - name: Build the web package
        run: bash tools/build_web.sh
      - name: Build owd
        run: cargo build --release -p owd-cli
      - name: Front end (type check, desktop build, web build)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:web
      - name: Web smoke test (headless Chrome)
        working-directory: app
        env:
          # The smoke test saves screenshots of the example here.
          OWD_WEB_SHOTS: ${{ runner.temp }}/web-screenshots
        run: bash e2e/run-web.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-screenshots
          if-no-files-found: ignore
