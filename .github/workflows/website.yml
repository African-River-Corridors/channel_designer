name: Website

# Builds the website and docs (website/build.py) and checks the links. Spec 0010. The public URL is
# https://www.africanrivercorridors.com/owd: the ARC site proxies /owd to a GitHub Pages site
# (website/README.md). A pull request that touches the site or docs runs the build, so a change is
# proved before it merges. On main the site is also deployed to GitHub Pages (the maintainer turns Pages
# on, with source "GitHub Actions"; until then the deploy job fails and nothing else is affected).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/website.yml"
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned docs tools
        run: python -m pip install -r website/requirements.txt
      - name: Build the site and docs (mkdocs --strict fails on a broken docs link)
        run: python website/build.py
      - name: Check every internal link in the built site
        run: python website/check_links.py
      - name: The site's token file is the app's token file
        run: cmp website/tokens.css app/src/tokens.css
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://www.africanrivercorridors.com/owd
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
