[package]
name = "owd-format"
description = "The parity seam (eval) now; the .owd document in spec 0002."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
owd-core.workspace = true
arc-rules.workspace = true
otd.workspace = true
otd-imagery = { workspace = true, optional = true }
serde_json.workspace = true
libm = "0.2"
png = "0.18"
proj4rs = { version = "0.2.1", default-features = false }
sha2 = "0.11.1"
rusqlite = { version = "0.40.2", features = ["bundled", "serialize"] }
tiff = { version = "0.11.3", default-features = false, features = ["deflate", "lzw"] }

[features]
# `owd draw --imagery`: fetch EOxCloudless 2016 for plan backdrops. Off for the web build, which has no
# network crate.
imagery = ["dep:otd-imagery"]
