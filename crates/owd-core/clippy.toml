# Platform-identical maths (spec 0001): the core uses the pure-Rust `libm` crate for every
# transcendental, so results are bit-identical on Windows, macOS, Linux and WebAssembly.
# The standard-library versions, `powi` and `mul_add` are banned here, for f64 and for f32
# (tests/banned_maths.rs keeps the two lists in step).
disallowed-methods = [
  { path = "f64::sin", reason = "use libm::sin" },
  { path = "f64::cos", reason = "use libm::cos" },
  { path = "f64::tan", reason = "use libm::tan" },
  { path = "f64::sin_cos", reason = "use libm::sin and libm::cos" },
  { path = "f64::asin", reason = "use libm::asin" },
  { path = "f64::acos", reason = "use libm::acos" },
  { path = "f64::atan", reason = "use libm::atan" },
  { path = "f64::atan2", reason = "use libm::atan2" },
  { path = "f64::sinh", reason = "use libm::sinh" },
  { path = "f64::cosh", reason = "use libm::cosh" },
  { path = "f64::tanh", reason = "use libm::tanh" },
  { path = "f64::asinh", reason = "use libm::asinh" },
  { path = "f64::acosh", reason = "use libm::acosh" },
  { path = "f64::atanh", reason = "use libm::atanh" },
  { path = "f64::exp", reason = "use libm::exp" },
  { path = "f64::exp2", reason = "use libm::exp2" },
  { path = "f64::exp_m1", reason = "use libm::expm1" },
  { path = "f64::ln", reason = "use libm::log" },
  { path = "f64::log", reason = "use libm::log(x) / libm::log(base), as Python does" },
  { path = "f64::log2", reason = "use libm::log2" },
  { path = "f64::log10", reason = "use libm::log10" },
  { path = "f64::ln_1p", reason = "use libm::log1p" },
  { path = "f64::powf", reason = "use libm::pow (Python's **)" },
  { path = "f64::powi", reason = "platform-dependent; use libm::pow (Python's **)" },
  { path = "f64::cbrt", reason = "use libm::cbrt" },
  { path = "f64::hypot", reason = "use libm::hypot" },
  { path = "f64::mul_add", reason = "fused multiply-add changes rounding; write a * b + c as Python does" },
  { path = "f32::sin", reason = "the core is f64; use libm" },
  { path = "f32::cos", reason = "the core is f64; use libm" },
  { path = "f32::tan", reason = "the core is f64; use libm" },
  { path = "f32::sin_cos", reason = "the core is f64; use libm" },
  { path = "f32::asin", reason = "the core is f64; use libm" },
  { path = "f32::acos", reason = "the core is f64; use libm" },
  { path = "f32::atan", reason = "the core is f64; use libm" },
  { path = "f32::atan2", reason = "the core is f64; use libm" },
  { path = "f32::sinh", reason = "the core is f64; use libm" },
  { path = "f32::cosh", reason = "the core is f64; use libm" },
  { path = "f32::tanh", reason = "the core is f64; use libm" },
  { path = "f32::asinh", reason = "the core is f64; use libm" },
  { path = "f32::acosh", reason = "the core is f64; use libm" },
  { path = "f32::atanh", reason = "the core is f64; use libm" },
  { path = "f32::exp", reason = "the core is f64; use libm" },
  { path = "f32::exp2", reason = "the core is f64; use libm" },
  { path = "f32::exp_m1", reason = "the core is f64; use libm" },
  { path = "f32::ln", reason = "the core is f64; use libm" },
  { path = "f32::log", reason = "the core is f64; use libm" },
  { path = "f32::log2", reason = "the core is f64; use libm" },
  { path = "f32::log10", reason = "the core is f64; use libm" },
  { path = "f32::ln_1p", reason = "the core is f64; use libm" },
  { path = "f32::powf", reason = "the core is f64; use libm" },
  { path = "f32::powi", reason = "the core is f64; use libm" },
  { path = "f32::cbrt", reason = "the core is f64; use libm" },
  { path = "f32::hypot", reason = "the core is f64; use libm" },
  { path = "f32::mul_add", reason = "the core is f64; no fused multiply-add" },
]
