[project]
name = "channel_designer"
version = "0.1.0"
description = "Navigation channel design for inland waterways: width, bend and depth rules (PIANC, Chinese GB 50139), alignment, and cut and dredge volumes."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "African River Corridors Limited" }]
readme = "README.md"
keywords = ["inland-waterways", "navigation-channel", "pianc", "dredging", "earthworks", "river-engineering"]
dependencies = [
    "numpy>=1.26",
    "shapely>=2.0",
    "vessel_designer @ git+https://github.com/African-River-Corridors/vessel_designer@main",
]

[project.optional-dependencies]
# Raster DEM I/O for the volume integrator and DEM-backed terrain samplers.
dem = ["rasterio>=1.3", "scipy>=1.11", "affine>=2.4"]
# Cross-section sheets (SVG/DXF). Pulls the drawing toolkit.
drawings = [
    "technical_drawings_for_agents @ git+https://github.com/African-River-Corridors/technical_drawings_for_agents@main",
]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/African-River-Corridors/channel_designer"
Issues = "https://github.com/African-River-Corridors/channel_designer/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/channel_designer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
