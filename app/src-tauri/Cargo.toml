[package]
name = "owd-app"
description = "The Open Waterway Designer desktop app: a thin Tauri shell over the design session in owd-format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "owd_app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Set by `tauri build`: the app serves its built front end instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
base64 = "0.22"
owd-core.workspace = true
owd-cli = { path = "../../crates/owd-cli" }
owd-format.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
