[package]
name = "cd-cli"
description = "The cdesign command-line tool: a thin layer over cd-format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cd_cli"
path = "src/lib.rs"

[[bin]]
name = "cdesign"
path = "src/main.rs"

[dependencies]
cd-format.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde_json.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
cd-core.workspace = true
tiff = { version = "0.11.3", default-features = false }
sha2 = "0.11.1"
