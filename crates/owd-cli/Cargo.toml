[package]
name = "owd-cli"
description = "The owd command-line tool (Open Waterway Designer): a thin layer over owd-format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "owd_cli"
path = "src/lib.rs"

[[bin]]
name = "owd"
path = "src/main.rs"

[dependencies]
owd-format = { workspace = true, features = ["imagery"] }
owd-reach.workspace = true
owd-core.workspace = true
arc-rules.workspace = true
# `otd::Files`: `owd draw run` reads a document's images from its folder.
otd.workspace = true
# `owd draw --imagery`: the source, its licence rule and the tile fetcher.
otd-imagery.workspace = true
clap = { version = "4.6.7", features = ["derive", "env"] }
serde_json.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
owd-core.workspace = true
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
