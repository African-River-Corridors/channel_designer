[package]
name = "owd-cli"
description = "The owd command-line tool (Open Waterway Designer): a thin layer over owd-format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "owd_cli"
path = "src/lib.rs"

[[bin]]
name = "owd"
path = "src/main.rs"

# The old name, an alias of `owd` for one release (spec 0006).
[[bin]]
name = "cdesign"
path = "src/bin/cdesign.rs"

[dependencies]
owd-format.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
serde_json.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }

[dev-dependencies]
owd-core.workspace = true
tiff = { version = "0.11.3", default-features = false, features = ["deflate"] }
sha2 = "0.11.1"
