    <p class="kicker">Web app</p>
    <h1>This build of the site has no web app.</h1>

    <p class="cta"><a class="btn primary" href="/owd/docs#install">Install the desktop app</a><a class="btn" href="/owd/docs">Read the docs</a></p>
