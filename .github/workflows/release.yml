name: Release

# On a version tag (v*): builds the wheels and the sdist, and attaches them to a GitHub release.
# PyPI publishing is off until v0.4 (maintainer's decision, 2026-10-23): the package depends on
# vessel-designer from git, which PyPI refuses. From v0.4 the `publish` job runs again, through
# PyPI trusted publishing (no token stored; the publisher is this repo, release.yml, environment "pypi").

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }

  # One abi3 wheel per platform (the same build as wheels.yml), so `pip install` needs no compiler.
  wheels:
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/

  sdist:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  github-release:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist/
          merge-multiple: true
      - name: Attach the files to the GitHub release (create it if missing)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "Open Waterway Designer ${TAG#v}" --generate-notes -R "$GITHUB_REPOSITORY"
          fi

  publish:
    # Off until v0.4: PyPI refuses the git dependency on vessel-designer.
    if: ${{ !startsWith(github.ref_name, 'v0.0') && !startsWith(github.ref_name, 'v0.1') && !startsWith(github.ref_name, 'v0.2') && !startsWith(github.ref_name, 'v0.3') }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist/
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
