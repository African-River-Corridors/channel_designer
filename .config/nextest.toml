# cargo-nextest profiles (issue #151, build-speed fix 3).
#
#   pr       the pull-request gate (tools/gates.sh): everything except the slow tests below.
#   nightly  every test, slow ones included (.github/workflows/nightly.yml).
#
# Nothing is deleted. A test in the slow list runs in the nightly workflow instead of on every pull
# request. A test that is renamed drops out of the list and so runs in the PR job again: the safe
# direction. The list and one reason per test: docs/agents/slow-tests.md. Local full run:
#   cargo nextest run --workspace --exclude owd-app --exclude owd-py --all-features --profile nightly

[profile.default]
fail-fast = false

[profile.pr]
fail-fast = false
default-filter = '''
not (
    (binary_id(owd-cli::volumes) & test(=the_chain_gives_the_same_document_as_run_on_the_same_inputs_and_settings)) |
    (binary_id(owd-format::optimise) & test(=volumes_measure_the_lattice_option_like_any_other_under_the_pool_levels)) |
    (binary_id(owd-cli::volumes) & test(=export_writes_the_quantity_table_and_the_options_with_the_screening_label)) |
    (binary_id(owd-cli::volumes) & test(=optimise_adds_the_lattice_option_and_volumes_measure_it)) |
    (binary_id(owd-core) & test(=alignment::rolling_circle::water::tests::at_46_m_the_fairway_fit_places_every_bend)) |
    (binary_id(owd-format::optimise) & test(=weirs_pools_and_the_lattice_option_equal_the_core_called_directly)) |
    (binary_id(owd-core) & test(=alignment::fairway_fit::corridor_tests::a_narrow_creek_is_never_fitted_sharper_than_its_input)) |
    (binary_id(owd-core) & test(=alignment::rolling_circle::water::tests::at_40_m_every_apex_is_too_narrow_and_the_option_keeps_a_line)) |
    (binary_id(owd-format::alignment) & test(=a_stage_run_runs_the_rolling_circle_and_a_new_vessel_makes_it_stale_then_run_reruns_both)) |
    (binary_id(owd-cli::volumes) & test(=run_reruns_a_stale_volumes_stage)) |
    (binary_id(owd-format::volumes) & test(=run_stale_reruns_volumes_when_alignment_changes)) |
    (binary_id(owd-cli::volumes) & test(=a_changed_dem_warns_on_open_and_marks_volumes_stale)) |
    (binary_id(owd-format::volumes) & test(=the_volumes_equal_section_volumes_called_directly)) |
    (binary_id(owd-cli::volumes) & test(=volumes_equal_the_core_called_directly_on_the_same_dem)) |
    (binary_id(owd-core) & test(=alignment::fairway_fit::property_tests::the_synthetic_river_fits_at_300_m_and_is_too_narrow_at_every_apex_at_40_m)) |
    (binary_id(owd-format::volumes) & test(=a_new_dem_reference_marks_volumes_stale)) |
    (binary_id(owd-format::volumes) & test(=a_saved_document_reloads_with_the_same_volumes)) |
    (binary_id(owd-format::volumes) & test(=a_changed_dem_file_warns_on_open_and_marks_volumes_stale)) |
    (binary_id(owd-cli::owd) & test(=align_adds_a_rolling_circle_option_and_replaces_it_when_run_again)) |
    (binary_id(owd-format::wgs84_river) & test(=a_wgs84_river_is_reprojected_and_gives_the_volumes_of_the_utm_river)) |
    (binary_id(owd-format::sections) & test(=the_long_section_sums_to_the_volumes_the_table_shows)) |
    (binary_id(owd-format::sections) & test(=a_cross_section_is_the_walk_s_station_and_its_cut_agrees_with_the_long_section)) |
    (binary_id(owd-format::sections) & test(=a_point_picked_on_the_map_gives_the_nearest_station)) |
    (binary_id(owd-format::volumes) & test(=volumes_needs_a_water_level_and_a_fresh_alignment)) |
    (binary_id(owd-format::volumes) & test(=volumes_refuses_without_a_dem_and_names_the_dem_it_cannot_read)) |
    (binary_id(owd-format::alignment) & test(=two_methods_give_two_options_and_a_rerun_replaces_only_its_own))
)
'''

[profile.nightly]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 5 }
