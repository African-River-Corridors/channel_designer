[package]
name = "owd-core"
description = "Pure calculation core of owd. Its modules mirror the Python files one to one."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# libm (spec 0001): every transcendental goes through it, so results are identical on every platform.
# ovcd-core (ADR 0001): vessel classes and the `Check` type, pinned to a release TAG, never a branch.
# dubins_paths (MIT, spec 0005): shortest bounded-curvature joins to fixed poses in the fairway fit.
# Built on libm, not std floats, to keep results identical on every platform.
# The Python reference pins the same tag (pyproject.toml, vessel_designer @ v0.2.2).
# arc-rules (Apache-2.0, spec 0007, ADR 0008): the shared rules engine. The channel Rule Sets are data in
# `rules/`; OWD registers its Measures and formula shapes and adds no engine logic.
# clarabel (Apache-2.0, pure Rust, ADR 0007): the convex QP of the fairway fit's corridor solve. Its
# box-constrained path uses only arithmetic and sqrt (no platform transcendentals).
[dependencies]
libm = "0.2"
dubins_paths = { version = "=3.2.0", default-features = false, features = ["libm", "alloc"] }
clarabel = "=0.11.1"
arc-rules.workspace = true
ovcd-core = { git = "https://github.com/African-River-Corridors/open-vessel-concept-drawings", tag = "v0.2.2" }

# web-time (spec 0011): `std::time::Instant` panics on wasm32-unknown-unknown; this is the same type on top of
# the browser's clock. Used on wasm only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time = "0.2"
