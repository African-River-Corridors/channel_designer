[package]
name = "owd-web"
description = "The design session in the browser: a thin wasm-bindgen layer over owd-shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22"
js-sys = "0.3"
owd-format.workspace = true
owd-shell.workspace = true
serde_json.workspace = true
# Exact pin: the wasm-bindgen CLI that makes the JS glue must be the same version
# (tools/build_web.sh checks it, and so does CI).
wasm-bindgen = "=0.2.129"
