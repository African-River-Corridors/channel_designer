[package]
name = "owd-reach"
description = "Inputs for a study made from open data (spec 0012): sources, routing, banks, water level. Pure Rust; builds native and wasm32; network access only through the Fetch trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
owd-core.workspace = true
owd-format.workspace = true
serde_json.workspace = true
# LZW for the tiled GeoTIFF reader (the tiff crate uses it too).
weezl = "0.1"
# DEFLATE for the Sentinel-2 COGs.
miniz_oxide = "0.8"
# The QA overlay (spec 0013): its PNG (as owd-format) and the 8 x 8 font of its legend (public domain glyphs, MIT).
png = "0.18"
font8x8 = "0.3"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
