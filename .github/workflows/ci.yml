name: CI

on:
  # Pushes to main only: a ticket branch is tested once, by its pull request, not twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly, so a break in an upstream git dependency shows up without a push here.
  schedule:
    - cron: "17 6 * * 1"

# A new push to a pull request cancels its older, now-stale run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The Rust caches save from main only (`save-if`): a pull request's cache serves no other pull request,
# and with every PR saving its own, the repository's 10 GB cache limit evicted main's caches.
permissions:
  contents: read

jobs:
  # Which parts of the tree a pull request changes. The app and web jobs below run on a pull request only
  # when their inputs change, and always on main, on the weekly run and by hand. The required jobs (`test`,
  # `release-guard`) never depend on this job and always run. A skipped job does not block a merge: only
  # `test` and `release-guard` are required.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      # On a pull request the filter reads the changed files from the API; no checkout is needed.
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # The desktop app and what it builds from: its own code, the crates it links (owd-cli pulls in
          # owd-reach and owd-report), the example files its smoke test opens, the toolchain and this workflow.
          # Any change under app/ runs the app jobs (app-e2e found a real bug in #268).
          filters: |
            app:
              - "app/**"
              - "crates/owd-core/**"
              - "crates/owd-format/**"
              - "crates/owd-cli/**"
              - "crates/owd-shell/**"
              - "crates/owd-reach/**"
              - "crates/owd-report/**"
              - "examples/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"
            web:
              - "app/**"
              - "crates/owd-core/**"
              - "crates/owd-format/**"
              - "crates/owd-cli/**"
              - "crates/owd-shell/**"
              - "crates/owd-reach/**"
              - "crates/owd-report/**"
              - "crates/owd-web/**"
              - "examples/**"
              - "tools/build_web.sh"
              - "tools/web_parity*.mjs"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - ".github/workflows/ci.yml"

  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh, run here in parallel parts. Each part
  # sets GATES_STEPS (and the Rust part GATES_PARTITION), so the script still checks that every step it
  # was given ran. `bash tools/gates.sh` with neither setting runs the whole gate locally, as before.
  # The job named `test` below needs every part; branch protection requires it by that name.
  gate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Format, clippy and the leftover-names check
        env:
          GATES_STEPS: fmt,clippy,oldnames
        run: bash tools/gates.sh

  # The Rust tests in N hash partitions (cargo-nextest, pinned), with Python made unusable. N = 3 by
  # measurement: the partitions take about 70-95 s of test time each, which is about as long as the
  # Python part. The slowest tests run in nightly.yml instead; see docs/agents/slow-tests.md.
  gate-rust:
    name: gate-rust (${{ matrix.partition }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: ["1/3", "2/3", "3/3"]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.100
      - name: Rust tests, one partition (the doctests run in partition 1)
        env:
          GATES_STEPS: rust
          GATES_PARTITION: ${{ matrix.partition }}
        run: bash tools/gates.sh

  gate-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # vessel-designer installs from PyPI (a wheel per platform).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,dem]'
      - name: pytest against the shipped package
        env:
          GATES_STEPS: pytest
        run: bash tools/gates.sh

  # The required check. It passes only when every part of the gate passed: a failed, skipped or
  # cancelled part fails it, and so does a missing or extra part.
  test:
    needs: [gate-lint, gate-rust, gate-python]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e '(keys == ["gate-lint", "gate-python", "gate-rust"]) and all(.[]; .result == "success")' >/dev/null \
            || { echo "test: a part of the gate did not pass" >&2; exit 1; }

  # The test job uses the vessel-designer release pinned in pyproject.toml. This job tries
  # OVCD at @main instead, so an upstream change that will break the next pin bump
  # shows up here first. Weekly and on demand only; it never gates a pull request.
  upstream-main:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (git dependencies at @main)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,dem]'
          python -m pip install --force-reinstall \
            'vessel_designer @ git+https://github.com/African-River-Corridors/open-vessel-concept-drawings@main'
      - name: Test
        run: python -m pytest -q

  # The drawing crate against the Python implementation of the same standard (spec 0004): the drawing
  # documents of every fixture design give equal normalised content in both. The Python tool is
  # installed at the commit that the pinned otd crate's standard/PIN.json pins (tools/otd.py), so a
  # suite update moves both together. The plain Rust tests need no Python.
  drawing-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build owd
        run: cargo build -p owd-cli
      - name: Install the Python implementation of the standard at the pinned commit
        run: |
          pin=$(python tools/otd.py pin)
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${pin}"
      - name: Rust and Python give equal normalised content for every fixture drawing document
        run: python tools/draw_crosscheck.py

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # The desktop app (spec 0003). Kept out of the fast gate: it needs Node and the Tauri system
  # libraries, and the workspace's default members must build without them.
  app-linux:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App crate (clippy, tests)
        run: |
          cargo clippy -p owd-app --all-targets -- -D warnings
          cargo test -p owd-app

  # End-to-end smoke test (spec 0003): the built debug app, driven by Tauri's WebDriver on Linux.
  # Its own job, so the fast gate keeps its time budget.
  app-e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tauri system libraries, WebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: tauri-driver (cached)
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        # --force: the Rust cache can hold the binary in ~/.cargo/bin when this cache entry was evicted.
        run: cargo install tauri-driver --version 2.1.0 --locked --force
      - name: Build the debug app
        working-directory: app
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Smoke test
        working-directory: app
        run: xvfb-run -a bash e2e/run.sh

  # Web parity (spec 0011): every web fixture gives the same document from the wasm design session as from
  # native `owd run`, by the ADR 0005 tolerance. Not a required check, and apart from `test` so the fast
  # gate keeps its time budget. The wasm-bindgen CLI is the version the owd-web crate pins, and is cached.
  web-parity:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/owd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/bin/wasm-bindgen-test-runner
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked --force
      - name: Lint the web session for wasm
        run: cargo clippy --target wasm32-unknown-unknown -p owd-web -- -D warnings
      - name: Build and lint owd-reach for wasm (spec 0012)
        run: |
          cargo clippy --target wasm32-unknown-unknown -p owd-reach -- -D warnings
          cargo build --target wasm32-unknown-unknown -p owd-reach
      - name: "owd-reach routing, bank, DEM, edge-fit and water-level tests in wasm (spec 0012, same fixtures as native)"
        run: cargo test --target wasm32-unknown-unknown -p owd-reach --test route --test banks --test dem --test edgefit --test level
        env:
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
      - name: Build the web package
        run: bash tools/build_web.sh
      # Release: the pool search is far too slow in a debug build.
      - name: Build owd
        run: cargo build --release -p owd-cli
      - name: The comparison fails on a doctored value
        run: node --test tools/web_parity_compare.test.mjs
      - name: Parity, wasm against native
        run: node tools/web_parity.mjs

  # The web app (spec 0011): the web build of the front end over the wasm design session, in headless
  # Chrome. Not a required check, and apart from `test`.
  web-app:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml) and the wasm32 target
        run: |
          rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/owd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked --force
      - name: Build the web package
        run: bash tools/build_web.sh
      - name: Build owd
        run: cargo build --release -p owd-cli
      - name: Front end (type check, desktop build, web build)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:web
      - name: Web smoke test (headless Chrome)
        working-directory: app
        env:
          # The smoke test saves screenshots of the example here.
          OWD_WEB_SHOTS: ${{ runner.temp }}/web-screenshots
        run: bash e2e/run-web.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-screenshots
          if-no-files-found: ignore
